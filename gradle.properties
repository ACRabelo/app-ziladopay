org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------
# Configuração do totem (edite antes de compilar)
# ---------------------------------------------------------------

# Nome Bluetooth (ou MAC) da Minizinha pareada no celular.
# Ex.: PAX-12345678 (Minizinha/NFC) ou Pag-12345678 (NFC 2 / ME30S)
totem.leitor=PAX-2221146407

# Servidor (totem-api, o Laravel) que já vem preenchido na tela de pareamento.
# Dá para trocar na própria tela, sem recompilar.
#  - celular de teste: IP do Mac na rede local, com o Laravel em
#        php artisan serve --host=0.0.0.0     ->  http://192.168.x.x:8000
#  - emulador do Android Studio: http://10.0.2.2:8000
#  - produção: https://seu-dominio
totem.api=http://10.0.2.2:8000

# Página carregada no WebView: a tela do totem que vai dentro do app.
totem.url=file:///android_asset/totem/index.html

# Fixa o app na tela (modo quiosque simples do Android). Deixe false no desenvolvimento.
totem.quiosque=false
